<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFIELD STOCK</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  color-scheme:light;
  --ink:#171717;
  --ink-2:#525252;
  --ink-3:#737373;
  --line:#e5e5e5;
  --line-2:#d4d4d4;
  --bg:#fafafa;
  --surface:#ffffff;
  --hover:#f5f5f5;
  --radius:4px;
  --accent:#ED6A1F;
  --accent-hover:#D95E17;
  --accent-text:#B54C0A;
  --on-accent:#171717;
  --bar:#737373;
  --bar-muted:#a3a3a3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
h1,h2,h3,p{margin:0;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.num{font-variant-numeric:tabular-nums;}
.only-m,.only-mf{display:none !important;}

/* app frame */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh;}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--line);padding:24px 16px 16px;
}
.brand{font-size:14px;font-weight:700;padding:0 8px;margin-bottom:24px;}
.nav{display:flex;flex-direction:column;gap:8px;}
.nav-btn{
  display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 8px;
  background:none;border:none;border-radius:var(--radius);color:var(--ink-2);text-align:left;
}
.nav-btn:hover{background:var(--hover);color:var(--ink);}
.nav-btn[aria-current="page"]{background:var(--hover);color:var(--ink);font-weight:600;}
.nav-btn[aria-current="page"] .icon{color:var(--accent);}
.save-status{margin-top:auto;padding:0 8px;font-size:12px;color:var(--ink-3);}
.save-status.err{color:var(--accent-text);font-weight:600;}
.main{min-width:0;padding:32px 40px 48px;}
.main-inner{max-width:1160px;}
.view{display:none;}
.view.active{display:block;}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;}
.page-head h1{font-size:20px;font-weight:700;line-height:1.4;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);white-space:nowrap;font-weight:500;
}
.btn:hover{background:var(--hover);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-sm{min-height:32px;padding:0 8px;font-size:13px;}
.btn-link{background:none;border:none;padding:0;min-height:0;font-weight:500;text-decoration:underline;text-underline-offset:2px;}
.btn-link:hover{background:none;color:var(--ink-2);}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  background:none;border:none;border-radius:var(--radius);color:var(--ink-3);
}
.icon-btn:hover{background:var(--line);color:var(--ink);}

/* summary strip */
.kpis{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:24px;
}
.kpi{padding:16px;border:none;border-left:1px solid var(--line);background:none;text-align:left;min-width:0;}
.kpi:first-child{border-left:none;}
.kpi-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);}
.kpi-value{display:block;font-size:20px;font-weight:600;line-height:1.4;margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
button.kpi{cursor:pointer;}
button.kpi:hover{background:var(--hover);}
button.kpi[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--accent);}
.kpi.is-alert .icon,.kpi.is-alert .kpi-value{color:var(--accent-text);}

/* charts */
.charts{display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:24px;}
.charts:empty{display:none;}
.charts.cols2{grid-template-columns:repeat(2,minmax(0,1fr));}
.chart{padding:16px;min-width:0;}
.charts.cols2 .chart+.chart{border-left:1px solid var(--line);}
.chart h2{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:8px;}
.bar-row{
  display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 136px;align-items:center;gap:8px;
  width:calc(100% + 16px);min-height:32px;margin:0 -8px;padding:4px 8px;
  background:none;border:none;border-radius:var(--radius);text-align:left;font-size:13px;
}
button.bar-row:hover{background:var(--hover);}
.bar-label{min-width:0;overflow-wrap:anywhere;line-height:1.35;}
.bar-area{display:block;border-left:1px solid var(--line-2);min-width:0;}
.bar{display:block;height:16px;min-width:2px;background:var(--bar);border-radius:0 4px 4px 0;}
.bar-row.is-other .bar{background:var(--bar-muted);}
.bar-row.is-other .bar-label{color:var(--ink-2);}
.bar-row[aria-pressed="true"] .bar{background:var(--accent);}
.bar-row[aria-pressed="true"] .bar-label{font-weight:600;}
.bar-val{white-space:nowrap;text-align:right;font-weight:500;font-variant-numeric:tabular-nums;}
.bar-val small{display:inline-block;min-width:40px;font-size:12px;font-weight:400;color:var(--ink-3);}
.meter{display:block;position:relative;width:80px;height:8px;margin:8px 0 4px auto;background:var(--line);border-radius:0 4px 4px 0;}
.meter-fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;}
.meter-fill.is-low{background:var(--accent);}
.meter-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);box-shadow:0 0 0 1px var(--surface);}
.neg{color:var(--accent-text);font-weight:600;}
.chart-note{font-size:12px;color:var(--ink-3);margin-top:8px;}

/* location tabs */
.loc-tabs{display:flex;gap:24px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none;}
.loc-tabs::-webkit-scrollbar{display:none;}
.loc-tab{
  flex:none;display:flex;align-items:baseline;gap:8px;min-height:40px;padding:8px 0;
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-2);
}
.loc-tab:hover{color:var(--ink);}
.loc-tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);}
.loc-tab .num{font-size:13px;color:var(--ink-3);font-weight:400;}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:400px;}
.search .icon{position:absolute;left:8px;top:12px;color:var(--ink-3);pointer-events:none;}
.search input{padding-left:32px;}
.input,.toolbar select{
  width:100%;min-height:40px;padding:0 8px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius);
}
.toolbar select{width:auto;flex:0 1 200px;min-width:0;}
.input:focus,.toolbar select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.input::placeholder{color:var(--ink-3);}
.input:disabled{background:var(--hover);color:var(--ink-2);}
.input[aria-invalid="true"]{border-color:var(--accent);border-width:2px;}
.result-count{align-self:center;margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;}

/* tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;white-space:nowrap;
}
.tbl td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle;height:56px;}
.tbl tbody tr:last-child>td{border-bottom:none;}
.tbl .r{text-align:right;}
.tbl tr.row-click{cursor:pointer;}
.tbl tr.row-click:hover>td{background:var(--hover);}
.c-toggle{width:40px;padding-right:0 !important;}
.c-actions{width:88px;white-space:nowrap;text-align:right;padding-left:0 !important;}
.sort-btn{display:inline-flex;align-items:center;gap:8px;padding:0;background:none;border:none;color:inherit;font-weight:inherit;}
.sort-btn:hover{color:var(--ink);}
.sort-btn .icon{width:12px;height:12px;}
.sort-btn[data-active="false"] .icon{opacity:.35;}
.sort-btn[data-active="true"] .icon{color:var(--accent-text);}
.name{font-weight:600;overflow-wrap:anywhere;}
.sub{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere;}
.dim{color:var(--ink-2);}
.none{color:var(--ink-3);}
.qty{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.qty small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:4px;}
.chev{transition:transform .12s;}
.chev.open{transform:rotate(90deg);}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:0 8px;min-height:24px;
  border:1px solid var(--accent);border-radius:var(--radius);color:var(--accent-text);font-size:12px;font-weight:500;white-space:nowrap;
}
.badge .icon{width:12px;height:12px;}
.badge-solid{background:var(--accent);color:var(--on-accent);font-weight:600;}
.badge-quiet{border-color:var(--line-2);color:var(--ink-2);font-weight:400;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.contact-line{display:block;font-size:13px;overflow-wrap:anywhere;}
.contact-line a{text-underline-offset:2px;}

/* detail row */
.detail>td{padding:0 !important;height:auto;background:var(--bg);}
.detail-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:32px;padding:16px 16px 24px 64px;}
.detail-title{font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:8px;}
.loc-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;border-bottom:1px solid var(--line);}
.loc-name{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;}
.stepper{display:flex;align-items:center;gap:8px;flex:none;}
.step-btn{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
}
.step-btn:hover{background:var(--hover);}
.step-input{
  width:64px;height:32px;padding:0 8px;text-align:right;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius);font-variant-numeric:tabular-nums;font-weight:600;
}
.step-input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.spacer{display:inline-block;width:32px;height:32px;}
.add-loc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;}
.add-loc select{flex:1 1 160px;min-width:0;min-height:32px;padding:0 8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);}
.add-loc input{width:80px;min-height:32px;padding:0 8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);}
.hint{font-size:12px;color:var(--ink-3);margin-top:8px;}
.meta-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.meta-row span:first-child{color:var(--ink-2);flex:none;}
.meta-row span:last-child{text-align:right;overflow-wrap:anywhere;}
.meta-actions{gap:8px;margin-top:16px;}

/* empty */
.empty{padding:32px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.empty-title{font-weight:600;margin-bottom:8px;}
.empty-text{color:var(--ink-2);margin-bottom:16px;}
.empty-text:last-child{margin-bottom:0;}

/* drawer */
dialog{color:var(--ink);padding:0;border:none;}
dialog::backdrop{background:rgba(23,23,23,.32);}
.drawer{
  position:fixed;inset:0 0 0 auto;margin:0;width:min(480px,100vw);height:100dvh;max-width:none;max-height:none;
  background:var(--surface);border-left:1px solid var(--line);
}
.drawer form{display:flex;flex-direction:column;height:100%;}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);}
.drawer-head h2{font-size:16px;font-weight:700;}
.drawer-body{flex:1;overflow-y:auto;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start;}
.drawer-foot{display:flex;gap:8px;padding:16px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.field{min-width:0;}
.field.full{grid-column:1 / -1;}
.field label,.field .label{display:block;font-size:13px;font-weight:500;margin-bottom:8px;}
.req{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:12px;}
.field-err{color:var(--accent-text);font-size:12px;font-weight:600;margin-top:8px;}
.field-err:empty{display:none;}
.calc{padding:8px 16px;background:var(--bg);border-radius:var(--radius);font-size:13px;display:flex;justify-content:space-between;gap:16px;}
.checks{display:flex;flex-wrap:wrap;gap:8px;}
.check{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--radius);cursor:pointer;font-size:13px;}
.check:has(input:checked){border-color:var(--accent);background:var(--hover);font-weight:500;}
.check input{margin:0;accent-color:var(--accent);}
.plain-value{min-height:40px;display:flex;align-items:center;font-weight:600;}

/* confirm */
.confirm{width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.confirm h2{font-size:16px;font-weight:700;margin-bottom:8px;}
.confirm p{color:var(--ink-2);margin-bottom:24px;overflow-wrap:anywhere;}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;}

/* toast */
.toast{
  position:fixed;left:232px;bottom:24px;z-index:50;display:none;align-items:center;gap:16px;
  max-width:calc(100vw - 48px);padding:8px 16px;min-height:40px;background:var(--ink);color:#fff;border-radius:var(--radius);font-size:13px;
}
.toast.show{display:flex;}
.toast button{padding:0;background:none;border:none;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;}

@media (max-width:1040px){
  .main{padding:24px;}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  .kpi:nth-child(4){border-left:none;}
  .kpi:nth-child(n+4){border-top:1px solid var(--line);}
  .detail-inner{grid-template-columns:minmax(0,1fr);gap:24px;padding-left:16px;}
  .charts.cols2{grid-template-columns:minmax(0,1fr);}
  .charts.cols2 .chart+.chart{border-left:none;border-top:1px solid var(--line);}
}
@media (max-width:720px){
  .only-m{display:block !important;}
  .only-mf{display:flex !important;}
  .only-d{display:none !important;}
  .app{display:block;}
  .side{
    position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;padding:0 0 env(safe-area-inset-bottom);
    border-right:none;border-top:1px solid var(--line);
  }
  .brand,.side .save-status{display:none;}
  .nav{flex-direction:row;gap:0;}
  .nav-btn{flex:1;flex-direction:column;gap:0;justify-content:center;min-height:56px;padding:0 4px;font-size:11px;border-radius:0;text-align:center;}
  .nav-btn[aria-current="page"]{background:none;}
  .nav-btn .icon{width:20px;height:20px;margin-bottom:4px;}
  .main{padding:16px 16px 88px;}
  .page-head{margin-bottom:16px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px;}
  .kpi{padding:8px 16px;border-left:none;border-top:1px solid var(--line);}
  .kpi:nth-child(n){border-top:1px solid var(--line);}
  .kpi:nth-child(-n+2){border-top:none;}
  .kpi:nth-child(even){border-left:1px solid var(--line);}
  .kpi:last-child{grid-column:1 / -1;border-left:none;}
  .kpi-value{font-size:16px;margin-top:0;}
  .charts{margin-bottom:16px;}
  .bar-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;min-height:40px;}
  .bar-area{grid-column:1 / -1;grid-row:2;}
  .bar{height:8px;}
  .search{flex-basis:100%;max-width:none;}
  .toolbar select{flex:1 1 auto;}
  .result-count{display:none;}
  input,select{font-size:16px !important;}

  .tbl-wrap{overflow:visible;}
  .tbl,.tbl tbody{display:block;}
  .tbl thead{display:none;}
  .tbl tr{display:block;position:relative;}
  .tbl tbody>tr{border-bottom:1px solid var(--line);}
  .tbl tbody>tr:last-child{border-bottom:none;}
  .tbl td{display:block;height:auto;border-bottom:none;padding:0;}

  .tbl-inv tr.row-click{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;padding:8px 16px 8px 8px;min-height:64px;}
  .tbl-inv .c-toggle{width:auto;}
  .tbl-inv .c-qty{text-align:right;padding-left:8px;}
  .tbl-inv tr.row-click.is-open{border-bottom:none;}

  .tbl-master tr{padding:16px;}
  .tbl-master td{margin-top:8px;}
  .tbl-master td:first-child{margin-top:0;padding-right:88px;}
  .tbl-master td[data-label]{display:flex;justify-content:space-between;gap:16px;font-size:13px;text-align:right;}
  .tbl-master td[data-label]::before{content:attr(data-label);color:var(--ink-2);text-align:left;flex:none;}
  .tbl-master td[data-label]>*{min-width:0;}
  .tbl-master .tags{justify-content:flex-end;}
  .tbl-master .c-actions{position:absolute;top:8px;right:8px;margin:0;width:auto;}
  .icon-btn,.step-btn{width:40px;height:40px;}
  .step-input{height:40px;}
  .spacer{width:40px;height:40px;}
  .add-loc select,.add-loc input{min-height:40px;}
  .btn-sm{min-height:40px;padding:0 16px;}
  .detail-inner{padding:8px 16px 16px;}
  .drawer{width:100vw;border-left:none;}
  .drawer-head{padding:8px 8px 8px 16px;}
  .drawer-body{padding:16px;}
  .drawer-foot{padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .drawer-foot .btn{flex:1;}
  .toast{left:16px;right:16px;bottom:72px;max-width:none;justify-content:space-between;}
}

[hidden]{display:none !important;}
.login{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:96px 16px 48px;}
.login-box{display:grid;gap:16px;width:min(360px,100%);padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.login-box h1{font-size:16px;font-weight:700;}
.login-box .field label{display:block;font-size:13px;font-weight:500;margin-bottom:8px;}
.head-actions{display:flex;align-items:center;gap:8px;}
.side-foot{margin-top:auto;display:grid;gap:8px;}
.side-foot .save-status{margin:0;}
.btn-plain{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;background:none;border:none;border-radius:var(--radius);color:var(--ink-2);text-align:left;}
.btn-plain:hover{background:var(--hover);color:var(--ink);}
.op-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.op-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.op-choices .btn{min-height:56px;}
.detail-gap{margin-top:24px;}
.sub-inline{margin-left:8px;font-size:12px;color:var(--ink-3);}
.badge-line:empty{display:none;}
.badge-line{margin-top:4px;}
a.btn{color:inherit;text-decoration:none;}
.drawer-body .plain-value{min-height:0;}
.chart-note{overflow-wrap:anywhere;}
@media (max-width:720px){.tbl tr.row-click:hover>td{background:none;}.tbl tr.row-click:hover{background:var(--hover);}}
.drawer-msg{padding:8px 24px;font-size:13px;font-weight:600;color:var(--accent-text);border-top:1px solid var(--line);overflow-wrap:anywhere;}
@media (max-width:720px){.drawer-msg{padding:8px 16px;}}
.v-edit{font-size:12px;font-weight:400;}
.v-link{display:block;margin-top:4px;font-size:12px;font-weight:400;}
.vf-presets{display:flex;flex-wrap:wrap;gap:8px;}

/* ---------- helpers ---------- */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtYen(n){ return '¥' + Math.round(Number(n)||0).toLocaleString('ja-JP'); }
function fmtNum(n){ return (Number(n)||0).toLocaleString('ja-JP'); }
function icon(name){ return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
function includes(hay, term){ return !term || String(hay||'').toLowerCase().includes(term.toLowerCase()); }
function byText(a,b){ return String(a||'').localeCompare(String(b||''),'ja'); }
function today(){
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function canWrite(){ return !!me && (me.role==='owner' || me.role==='staff'); }
function errText(e){
  const m = (e && e.message) || '';
  if(/row-level security|permission denied|権限/.test(m)) return 'この操作を行う権限がありません。';
  if(/Failed to fetch|NetworkError|Load failed/.test(m)){
    return window.top!==window.self
      ? '通信できませんでした。プレビュー画面では接続できない場合があります。ファイルをダウンロードして、ブラウザで開いてください。'
      : '通信できませんでした。電波の状態を確認して、もう一度お試しください。';
  }
  return m || '処理できませんでした。もう一度お試しください。';
}

/* ---------- toast / confirm / drawer ---------- */
let toastTimer = null;
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}
function confirmDialog(title, text, yesLabel){
  return new Promise(resolve=>{
    const d = el('confirmDlg');
    el('confirmTitle').textContent = title;
    el('confirmText').textContent = text;
    el('confirmYes').textContent = yesLabel;
    let answer = false;
    el('confirmYes').onclick = ()=>{ answer = true; d.close(); };
    el('confirmNo').onclick = ()=> d.close();
    d.addEventListener('close', ()=>resolve(answer), {once:true});
    d.showModal();
    el('confirmNo').focus();
  });
}
let drawerSubmit = null, drawerBusy = false, drawerOp = null;
function openDrawer(title, body, onSubmit, submitLabel){
  el('drawerTitle').textContent = title;
  el('drawerBody').innerHTML = body;
  showDrawerMsg('');
  el('drawerSubmit').textContent = submitLabel || '保存';
  el('drawerSubmit').hidden = false;
  drawerSubmit = onSubmit;
  const d = el('drawer');
  if(!d.open) d.showModal();
  el('drawerBody').scrollTop = 0;
  const first = el('drawerBody').querySelector('input:not([disabled]),select:not([disabled])');
  if(first) first.focus();
}
function closeDrawer(){ if(el('drawer').open) el('drawer').close(); }
function setFieldError(name, msg){
  const input = el('drawerBody').querySelector(`[name="${name}"]`);
  const err = el('drawerBody').querySelector(`[data-err="${name}"]`);
  if(err) err.textContent = msg;
  if(msg) showDrawerMsg(msg);
  if(input){ input.setAttribute('aria-invalid','true'); input.focus(); input.scrollIntoView({block:'center'}); }
}
/* Sits above the buttons so the reason is on screen however far the form is scrolled, which matters on a phone */
function showDrawerMsg(msg){ const m = el('drawerMsg'); m.textContent = msg; m.hidden = !msg; }
function setFormError(msg){ showDrawerMsg(msg); }
function clearFieldErrors(){
  showDrawerMsg('');
  el('drawerBody').querySelectorAll('[aria-invalid]').forEach(n=>n.removeAttribute('aria-invalid'));
  el('drawerBody').querySelectorAll('[data-err]').forEach(n=>{ n.textContent=''; });
}
function field(o){
  const id = 'f_'+o.name;
  const req = o.required ? '<span class="req">必須</span>' : '';
  const attrs = `id="${id}" name="${o.name}" class="input"`;
  let control;
  if(o.options){
    control = `<select ${attrs}>${o.options.map(x=>`<option value="${esc(x.value)}"${String(x.value)===String(o.value??'')?' selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
  } else {
    const numAttrs = o.type==='number' ? ` min="${o.min??0}" inputmode="numeric"` : '';
    control = `<input ${attrs} type="${o.type||'text'}" value="${esc(o.value??'')}" placeholder="${esc(o.placeholder||'')}"${numAttrs}>`;
  }
  return `<div class="field${o.half?'':' full'}"><label for="${id}">${esc(o.label)}${req}</label>${control}${o.after||''}<div class="field-err" data-err="${o.name}"></div></div>`;
}
const formErrorSlot = '<div class="field full"><div class="field-err" data-err="_form" role="alert"></div></div>';
function formValues(){
  const out = {};
  for(const [k,v] of new FormData(el('drawerForm')).entries()) out[k] = typeof v==='string' ? v.trim() : v;
  return out;
}
function posInt(v){ const n = Number(v); return v!=='' && Number.isInteger(n) && n>0 ? n : null; }
function nonNegInt(v){ const n = Number(v); return v!=='' && Number.isInteger(n) && n>=0 ? n : null; }

/* ---------- data ---------- */
async function fetchAll(table, order){
  const size = 1000; let start = 0; let rows = [];
  for(;;){
    const { data, error } = await sb.from(table).select('*').order(order||'id').range(start, start+size-1);
    if(error) throw error;
    rows = rows.concat(data||[]);
    if(!data || data.length<size) return rows;
    start += size;
  }
}
async function loadAll(){
  const [products,inventories,warehouses,suppliers,productSuppliers,businesses,customers,txns,models] = await Promise.all([
    fetchAll('products','product_code'), fetchAll('inventories'), fetchAll('warehouses','warehouse_code'),
    fetchAll('suppliers','supplier_code'), fetchAll('product_suppliers'), fetchAll('businesses','sort'),
    fetchAll('customers'), fetchAll('inventory_transactions'), fetchAll('product_models','model_code')
  ]);
  Object.assign(db,{products,inventories,warehouses,suppliers,productSuppliers,businesses,customers,txns,models});
}
async function refresh(){ await loadAll(); renderAll(); }

function activeProducts(){ return db.products.filter(p=>p.active); }
function stockMap(pid){ const m = {}; db.inventories.filter(i=>i.product_id===pid).forEach(i=>{ m[i.warehouse_id]=i.quantity; }); return m; }
function totalQty(pid){ return db.inventories.filter(i=>i.product_id===pid).reduce((s,i)=>s+i.quantity,0); }
function qtyAt(pid, loc){ if(loc==='all') return totalQty(pid); const r = db.inventories.find(i=>i.product_id===pid && String(i.warehouse_id)===String(loc)); return r?r.quantity:0; }
function primarySupplier(pid){
  const link = db.productSuppliers.find(x=>x.product_id===pid && x.is_primary);
  return link ? db.suppliers.find(s=>s.id===link.supplier_id)||null : null;
}
function bizName(code){ const b = db.businesses.find(x=>x.code===code); return b?b.name:'未分類'; }
function whName(id){ const w = db.warehouses.find(x=>x.id===id); return w?w.warehouse_name:'(不明な保管場所)'; }
function productName(id){ const p = db.products.find(x=>x.id===id); return p?fullName(p):'(不明な商品)'; }
/* A size or capacity is one row in products (its own stock and history), tied together by product_models */
function variantLabel(p){ return Object.values(p.variant_attrs||{}).filter(x=>x!==null&&x!=='').join(' / '); }
function fullName(p){ const v = variantLabel(p); return v?`${p.product_name} / ${v}`:p.product_name; }
const SIZE_ORDER = ['XXS','XS','S','M','L','LL','XL','XXL','2XL','3L','3XL','4L','4XL','5L','5XL','FREE','F'];
const UNDECIDED = '未確定';
function isUndecided(p){ return variantLabel(p)===UNDECIDED; }
function byVariant(a,b){
  if(isUndecided(a)!==isUndecided(b)) return isUndecided(a)?1:-1;
  const la = variantLabel(a).toUpperCase(), lb = variantLabel(b).toUpperCase();
  const ra = SIZE_ORDER.indexOf(la), rb = SIZE_ORDER.indexOf(lb);
  if(ra>=0 && rb>=0) return ra-rb;
  const na = parseFloat(la), nb = parseFloat(lb);
  if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
  return byText(a.product_code,b.product_code);
}
function productGroups(){
  const byModel = new Map(), out = [];
  activeProducts().forEach(p=>{
    const m = p.model_id!=null ? db.models.find(x=>x.id===p.model_id) : null;
    if(m){
      let g = byModel.get(m.id);
      if(!g){ g = { key:'m'+m.id, model:m, name:m.model_name, code:m.model_code, business_code:m.business_code, unit:p.unit, items:[] }; byModel.set(m.id,g); out.push(g); }
      g.items.push(p);
    } else out.push({ key:'p'+p.id, model:null, name:p.product_name, code:p.product_code, business_code:p.business_code, unit:p.unit, items:[p] });
  });
  out.forEach(g=>g.items.sort(byVariant));
  return out.sort((a,b)=>byText(a.code,b.code));
}
function groupByKey(key){ return productGroups().find(g=>g.key===key)||null; }
function groupQty(g){ return g.items.reduce((s,p)=>s+totalQty(p.id),0); }
function groupShown(g){ return g.items.reduce((s,p)=>s+shownQty(p),0); }
function groupValue(g){ return g.items.reduce((s,p)=>s+shownQty(p)*stockUnitCost(p),0); }
function groupLow(g){ return g.items.some(isLow); }
function groupNever(g){ return g.items.every(neverStocked); }
function groupSupplier(g){ for(const p of g.items){ const s = primarySupplier(p.id); if(s) return s; } return null; }
function activeWarehouses(){ return db.warehouses.filter(w=>w.active); }
/* Stock is valued at the weighted average of recorded inbound costs; the master cost (next purchase) is the fallback */
function stockUnitCost(p){
  let q=0, c=0;
  db.txns.forEach(t=>{ if(t.product_id===p.id && t.transaction_type==='INBOUND' && t.unit_cost!=null){ q+=t.quantity; c+=t.quantity*Number(t.unit_cost); } });
  return q>0 ? c/q : Number(p.standard_cost)||0;
}
function taxRate(p){ return p.tax_rate!=null ? Number(p.tax_rate) : (FOOD_CODES.some(c=>p.product_code===c||p.product_code.startsWith(c+'-'))?0.08:0.10); }
function netPrice(p){ return Number(p.selling_price)>0 ? Number(p.selling_price)/(1+taxRate(p)) : 0; }
function marginOf(p){ const n = netPrice(p); return n>0 ? (n-Number(p.standard_cost||0))/n*100 : null; }
/* A product that has never moved and has no reorder point is not "out of stock": it simply has not arrived yet */
function neverStocked(p){ return totalQty(p.id)===0 && Number(p.reorder_point||0)===0 && !db.txns.some(t=>t.product_id===p.id); }
function isLow(p){ const q = totalQty(p.id); return !isUndecided(p) && !neverStocked(p) && (q===0 || q<Number(p.reorder_point||0)); }

function statusBadge(p){
  const q = totalQty(p.id);
  if(neverStocked(p)) return '<span class="badge badge-quiet">未入荷</span>';
  if(q===0) return '<span class="badge badge-solid">在庫切れ</span>';
  if(q<Number(p.reorder_point||0)) return `<span class="badge">${icon('alert')}僅少</span>`;
  return '';
}
function groupBadge(g){
  if(!g.model) return statusBadge(g.items[0]);
  if(groupNever(g)) return '<span class="badge badge-quiet">未入荷</span>';
  if(groupQty(g)===0) return '<span class="badge badge-solid">在庫切れ</span>';
  return groupLow(g) ? `<span class="badge">${icon('alert')}一部不足</span>` : '';
}
function emptyHtml(title, text, action){
  return `<div class="empty"><div class="empty-title">${esc(title)}</div>${text?`<p class="empty-text">${esc(text)}</p>`:''}${action||''}</div>`;
}
function bizOptions(selectEl, current, list){
  const codes = db.businesses.filter(b=>list.some(p=>p.business_code===b.code));
  const hasNone = list.some(p=>!p.business_code);
  selectEl.innerHTML = [`<option value="全て">サービス: すべて (${list.length})</option>`]

    .concat(hasNone?[`<option value="未分類">未分類 (${list.filter(p=>!p.business_code).length})</option>`]:[]).join('');
  selectEl.value = current;
  if(selectEl.value!==current) selectEl.value='全て';
}
function matchBiz(p, cat){ return cat==='全て' || (cat==='未分類' ? !p.business_code : p.business_code===cat); }

/* ---------- navigation ---------- */
function setSection(name){
  section = SECTIONS.includes(name) ? name : 'inventory';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+section));
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.dataset.section===section) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });

  window.scrollTo(0,0);
}

function barRowHtml(r, max){
  const width = max>0 ? (r.value/max*100).toFixed(1) : 0;
  const pct = r.share<1 ? '1%未満' : `${Math.round(r.share)}%`;
  const inner = `<span class="bar-label">${esc(r.label)}</span><span class="bar-area"><span class="bar" style="width:${width}%"></span></span><span class="bar-val">${fmtYen(r.value)} <small>${pct}</small></span>`;
  const desc = `${r.label}: ${fmtYen(r.value)}(${pct})`;
  if(!r.act) return `<div class="bar-row${r.other?' is-other':''}" role="listitem" title="${esc(desc)}">${inner}</div>`;
  const pressed = r.pressed===undefined ? '' : ` aria-pressed="${r.pressed}"`;
  return `<div role="listitem"><button type="button" class="bar-row" data-act="${r.act}" data-id="${esc(r.id)}" data-fk="${r.act}-${esc(r.id)}"${pressed} title="${esc(desc)}" aria-label="${esc(desc)}">${inner}</button></div>`;
}
function renderCharts(){
  const list = activeProducts();

    .filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
  const locVal = {};
  list.forEach(p=>{ const c = stockUnitCost(p); db.inventories.filter(i=>i.product_id===p.id).forEach(i=>{ locVal[i.warehouse_id]=(locVal[i.warehouse_id]||0)+c*i.quantity; }); });
  const locRows = Object.entries(locVal).filter(([,v])=>v>0)
    .map(([id,value])=>({ id, label:whName(Number(id)), value, act:'chartLoc', pressed:String(invState.loc)===id }))
    .sort((a,b)=>b.value-a.value);
  const total = productRows.reduce((s,r)=>s+r.value,0);
  const panels = [];
  if(productRows.length>=2){
    let rows = productRows;
    if(rows.length>6){
      const rest = rows.slice(5);

    }

}

function shownQty(p){ return qtyAt(p.id, invState.loc); }
function filteredItems(){
  const list = productGroups().filter(g=>{
    const sup = groupSupplier(g), q = invState.search;
    return matchBiz(g, invState.cat)
      && (includes(g.name,q) || includes(g.code,q) || includes(sup&&sup.supplier_name,q)
          || g.items.some(p=>includes(p.product_code,q) || includes(fullName(p),q)))
      && (!invState.low || groupLow(g))
      && (invState.loc==='all' || groupShown(g)>0);
  });
  const d = invState.dir;
  return list.sort((a,b)=>{
    if(invState.sort==='name') return d*byText(a.name,b.name);
    if(invState.sort==='qty') return d*(groupShown(a)-groupShown(b));
    if(invState.sort==='value') return d*(groupValue(a)-groupValue(b));
    const la=groupLow(a), lb=groupLow(b);
    if(la!==lb) return la?-1:1;
    const na=groupNever(a), nb=groupNever(b);
    if(na!==nb) return na?1:-1;
    return byText(a.code,b.code);
  });
}
function sortHead(key,label,right){

function stockMeter(p){

}

function openOp(kind, key, pickable){
  const titles = { inbound:'入庫', outbound:'出庫', transfer:'移管', adjust:'棚卸・調整' };
  const whs = activeWarehouses();
  const g = key ? groupByKey(key) : null;
  const canPick = pickable || !key;
  const productF = canPick
    ? field({name:'product',label:'商品',required:true,value:key||'',options:productOptions()})
    : `<div class="field full"><span class="label">商品</span><div class="plain-value">${esc(g.name)}</div><input type="hidden" name="product" value="${esc(key)}"></div>`;
  const multi = g && g.model;
  const dateF = field({name:'date',label:kind==='adjust'?'調整日':'日付',type:'date',half:true,value:today(),required:true});
  const noteF = field({name:'remarks',label:'メモ',placeholder:'任意'});
  const qtyF = multi ? variantInputs(g,kind) : field({name:'qty',label:'数量',type:'number',min:1,half:true,required:true});
  let body = productF;
  const stocked = g ? g.items.map(p=>Object.entries(stockMap(p.id)).find(([,q])=>q>0)).find(Boolean) : null;
  const defaultWh = stocked ? stocked[0] : (whs[0]&&whs[0].id);
  if(kind==='inbound'){
    const sup = g ? groupSupplier(g) : null;
    const costs = g ? [...new Set(g.items.map(p=>Number(p.standard_cost)))] : [];
    const lastCost = costs.length===1 ? costs[0] : '';
    const hint = g && costs.length>1 ? '空欄なら、サイズごとの商品マスタの原価で登録します。' : '実際の金額に直すと、在庫金額に反映されます。';
    body += field({name:'wh',label:'入庫先',half:true,value:defaultWh,options:warehouseOptions(whs)})
      + qtyF + dateF
      + field({name:'cost',label:'仕入単価(円・税抜)',type:'number',half:true,value:lastCost,after:`<p class="hint">${hint}</p>`})
      + field({name:'supplier',label:'仕入れ先',value:sup?sup.id:'',options:[{value:'',label:'未選択'}].concat(db.suppliers.filter(s=>s.active).map(s=>({value:s.id,label:s.supplier_name})))});
  } else if(kind==='outbound'){
    body += field({name:'wh',label:'出庫元',half:true,value:defaultWh,options:warehouseOptions(whs)})
      + qtyF + dateF
      + field({name:'destination',label:'出庫先',half:true,placeholder:'チーム名、販売先など'});
  } else if(kind==='transfer'){
    const to = whs.find(w=>String(w.id)!==String(defaultWh));
    body += field({name:'wh',label:'移管元',half:true,value:defaultWh,options:warehouseOptions(whs)})
      + field({name:'to',label:'移管先',half:true,value:to?to.id:'',options:warehouseOptions(whs)})
      + qtyF + dateF;
  } else {
    body += field({name:'wh',label:'保管場所',half:true,value:defaultWh,options:warehouseOptions(whs)})
      + (multi ? qtyF : field({name:'after',label:'実際の数量',type:'number',half:true,required:true,after:'<p class="hint" id="adjustNow"></p>'}))
      + field({name:'reason',label:'理由',half:true,value:REASONS[0],options:REASONS.map(r=>({value:r,label:r}))})
      + dateF;
  }
  body += noteF + formErrorSlot;
  drawerOp = { kind, pickable:canPick }; variantForm = null;
  openDrawer(titles[kind], body, vals=>submitOp(kind, vals), '登録');
  updateAdjustHint();
}
function updateAdjustHint(){
  const v = formValues();
  el('drawerBody').querySelectorAll('[data-cur]').forEach(n=>{ n.textContent = v.wh ? `現在 ${fmtNum(qtyAt(Number(n.dataset.cur),v.wh))}` : ''; });
  const out = el('adjustNow'); if(!out) return;
  const g = v.product ? groupByKey(v.product) : null;
  out.textContent = g && v.wh ? `現在の記録: ${fmtNum(qtyAt(g.items[0].id,v.wh))}` : '';
}
function opCall(kind, v, productId, n, multi, unitCost){
  const remarks = v.remarks || null, base = { p_product_id:productId };
  if(kind==='adjust') return ['fn_web_adjustment',{...base,p_warehouse_id:Number(v.wh),p_quantity_after:n,p_reason:v.reason,p_adjusted_at:v.date,p_remarks:remarks}];
  if(kind==='inbound') return ['fn_web_inbound',{...base,p_warehouse_id:Number(v.wh),p_quantity:n,p_transaction_date:v.date,p_supplier_id:v.supplier?Number(v.supplier):null,p_unit_cost:v.cost===''?(multi?unitCost:null):Number(v.cost),p_remarks:remarks}];
  if(kind==='outbound') return ['fn_web_outbound',{...base,p_warehouse_id:Number(v.wh),p_quantity:n,p_transaction_date:v.date,p_destination:v.destination||null,p_remarks:remarks}];
  return ['fn_web_transfer',{...base,p_from_warehouse_id:Number(v.wh),p_to_warehouse_id:Number(v.to),p_quantity:n,p_transfer_date:v.date,p_remarks:remarks}];
}
const OP_DONE = { inbound:'入庫を登録しました', outbound:'出庫を登録しました', transfer:'移管を登録しました', adjust:'調整を登録しました' };
async function submitOp(kind, v){
  clearFieldErrors();
  if(!v.product){ setFieldError('product','商品を選択してください。'); return; }
  const g = groupByKey(v.product);
  if(!g){ setFieldError('product','商品を選択してください。'); return; }
  if(!v.date){ setFieldError('date','日付を入力してください。'); return; }
  if(kind==='inbound' && v.cost!=='' && !(Number(v.cost)>=0)){ setFieldError('cost','0以上で入力してください。'); return; }
  if(kind==='transfer' && v.wh===v.to){ setFieldError('to','移管元と違う場所を選んでください。'); return; }
  if(!g.model){
    const p = g.items[0];
    const n = kind==='adjust' ? nonNegInt(v.after) : posInt(v.qty);
    if(n===null){ if(kind==='adjust') setFieldError('after','0以上の整数で入力してください。'); else setFieldError('qty','1以上の整数で入力してください。'); return; }
    const [fn,params] = opCall(kind,v,p.id,n,false);
    const { error } = await sb.rpc(fn, params);
    if(error){ setFormError(errText(error)); return; }
    expandedIds.add(g.key); closeDrawer(); await refresh(); showToast(OP_DONE[kind]);
    return;
  }
  /* several sizes: check everything first so a mistake in one size stops the whole form before anything is saved */
  const lines = [];
  for(const p of g.items){
    const raw = v['q_'+p.id]; if(raw===undefined || raw==='') continue;
    const n = kind==='adjust' ? nonNegInt(raw) : (raw==='0'?0:posInt(raw));
    const name = variantLabel(p)||p.product_code;
    if(n===null){ setFieldError('q_'+p.id,kind==='adjust'?'0以上の整数で入力してください。':'1以上の整数で入力してください。'); return; }
    if(kind==='adjust'){ if(n===qtyAt(p.id,v.wh)) continue; }
    else if(n===0) continue;
    if((kind==='outbound'||kind==='transfer') && n>qtyAt(p.id,v.wh)){ setFieldError('q_'+p.id,`${name}の在庫が足りません(現在 ${fmtNum(qtyAt(p.id,v.wh))})。`); return; }
    lines.push({p,n,name});
  }
  if(!lines.length){ setFormError(kind==='adjust'?'変更する数量がありません。':'数量を1つ以上入力してください。'); return; }
  const done = [];
  for(const line of lines){
    const [fn,params] = opCall(kind,v,line.p.id,line.n,true,Number(line.p.standard_cost));
    const { error } = await sb.rpc(fn, params);
    if(error){
      await refresh().catch(()=>{});
      done.forEach(d=>{ const i = el('f_q_'+d.p.id); if(i) i.value=''; });
      updateAdjustHint();
      setFormError(`${done.length?`登録済み: ${done.map(d=>d.name).join('、')}(入力欄を空にしました)。`:''}${line.name}以降は登録できませんでした: ${errText(error)}`);
      return;
    }
    done.push(line);
  }
  expandedIds.add(g.key); closeDrawer(); await refresh();
  showToast(`${OP_DONE[kind]}(${done.map(d=>`${d.name} ${fmtNum(d.n)}`).join('、')})`);
}
function openThreshold(p){
  openDrawer('僅少ラインを設定',
    `<div class="field full"><span class="label">商品</span><div class="plain-value">${esc(fullName(p))}</div></div>`

      if(error){ setFormError(errText(error)); return; }

}
/* ---------- sizes and capacities: one form to split a product, add to it, and hand out the current stock ---------- */
const VARIANT_KEYS = ['サイズ','容量','カラー','その他'];
const SIZE_PRESETS = ['XS','S','M','L','XL','2XL','3XL','3L','4L','FREE'];
let variantForm = null;
function variantActionLabel(g){
  if(!g.model) return 'サイズ・容量を設定';
  return g.items.some(p=>isUndecided(p)&&totalQty(p.id)>0) ? 'サイズ・容量に振り分け' : 'サイズ・容量を追加';
}
function openVariantForm(key){
  const g = groupByKey(key); if(!g) return;
  const base = g.items[0];
  const source = !g.model ? base : g.items.find(isUndecided)||null;
  const stock = source ? stockMap(source.id) : {};
  const locs = Object.keys(stock).map(Number).filter(id=>stock[id]>0);
  const existing = g.model ? g.items.filter(p=>!isUndecided(p)) : [];
  const variantKey = g.model ? (g.model.variant_keys||[])[0]||'サイズ' : 'サイズ';
  variantForm = { g, base, source, stock, locs, existing, seq:0 };
  const total = locs.reduce((n,id)=>n+stock[id],0), u = g.unit||'個';
  const stockNote = total>0
    ? `<p class="hint">今の在庫 ${fmtNum(total)}${esc(u)}を、分かる分だけ振り分けてください。残りは「${UNDECIDED}」として残り、あとから振り分けられます。</p>` : '';
  const body = `<div class="field full"><span class="label">商品</span><div class="plain-value">${esc(g.name)}</div></div>`
    + (g.model
      ? `<div class="field full"><span class="label">種類</span><div class="plain-value">${esc(variantKey)}</div><input type="hidden" name="vkey" value="${esc(variantKey)}"></div>`
      : field({name:'vkey',label:'種類',half:true,value:variantKey,options:VARIANT_KEYS.map(k=>({value:k,label:k}))}))
    + `<div class="field full" id="vfPresetBox"><span class="label">よく使うサイズ</span><div class="vf-presets" id="vfPresets"></div></div>
       <div class="field full"><span class="label">サイズ・容量の一覧</span>${stockNote}
         <div class="vf-head"><span>名前</span><span>原価(円)</span><span>税込価格(円)</span><span></span></div>
         <div id="vfRows"></div>
         <button type="button" class="btn btn-sm vf-add" data-act="vAddRow">${icon('plus')}行を追加</button>
         <p class="hint vf-remain" id="vfRemain"></p>
       </div>
       <div class="field full"><p class="hint">登録したら、商品マスタにも同じ行を追加してください。</p></div>`
    + formErrorSlot;
  drawerOp = null;
  openDrawer(variantActionLabel(g), body, v=>submitVariants(v), '登録');
  if(locs.length) existing.forEach(p=>addVariantRow({product:p}));
  if(!existing.length || !locs.length) addVariantRow({});
  syncVariantForm();
}
function addVariantRow(o){
  const f = variantForm, i = ++f.seq, box = el('vfRows');
  const label = o.product ? variantLabel(o.product) : (o.label||'');
  const exists = o.product || (f.existing.some(p=>variantLabel(p).toLowerCase()===label.toLowerCase()) && label);
  if(label && !o.product && [...box.querySelectorAll('[data-vlabel]')].some(n=>n.value.trim().toLowerCase()===label.toLowerCase())) return null;
  /* an empty row is reused by the size shortcuts so tapping S M L does not leave a blank line at the top */
  if(label && !o.product){
    const blank = [...box.querySelectorAll('input[data-vlabel]:not([type=hidden])')].find(n=>!n.value.trim());
    if(blank && !exists){ blank.value = label; return blank.closest('.vf-row'); }
  }
  const cost = Number(f.base.standard_cost)||0, price = Number(f.base.selling_price)||0;
  const nameCell = o.product
    ? `<div class="vf-fixed">${esc(label)}<input type="hidden" name="vl_${i}" data-vlabel value="${esc(label)}"></div>`
    : `<input class="input" name="vl_${i}" data-vlabel aria-label="名前" value="${esc(label)}" placeholder="例: M、1000g">`;
  const moneyCells = o.product
    ? `<div class="vf-fixed vf-money num">${fmtYen(o.product.standard_cost)}</div><div class="vf-fixed vf-money num">${fmtYen(o.product.selling_price)}</div>`
    : `<input class="input" name="vc_${i}" aria-label="原価" type="number" min="0" inputmode="numeric" value="${cost}"><input class="input" name="vp_${i}" aria-label="税込価格" type="number" min="0" inputmode="numeric" value="${price}">`;
  const remove = o.product ? '<span></span>' : `<button type="button" class="icon-btn" data-act="vRemoveRow" aria-label="この行を削除">${icon('x')}</button>`;
  const alloc = f.locs.map(id=>`<label class="vf-alloc"><span>${esc(whName(id))}から</span><input class="input" name="va_${i}_${id}" data-wh="${id}" type="number" min="0" inputmode="numeric" placeholder="0"></label><div class="field-err" data-err="va_${i}_${id}"></div>`).join('');
  box.insertAdjacentHTML('beforeend', `<div class="vf-row" data-i="${i}"><div class="vf-line">${nameCell}${moneyCells}${remove}</div><div class="field-err" data-err="vl_${i}"></div>${alloc}</div>`);
  return box.lastElementChild;
}
function syncVariantForm(){
  const f = variantForm; if(!f || !el('vfRows')) return;
  const key = (el('drawerBody').querySelector('[name="vkey"]')||{}).value;
  const labels = [...el('vfRows').querySelectorAll('[data-vlabel]')].map(n=>n.value.trim().toLowerCase());
  const taken = f.existing.map(p=>variantLabel(p).toLowerCase());
  const box = el('vfPresetBox');
  box.hidden = key!=='サイズ';
  el('vfPresets').innerHTML = SIZE_PRESETS.map(s=>{
    const used = labels.includes(s.toLowerCase()) || taken.includes(s.toLowerCase());
    return `<button type="button" class="btn btn-sm" data-act="vPreset" data-label="${s}"${used?' disabled':''}>${s}</button>`;
  }).join('');
  const rem = el('vfRemain');
  if(!f.locs.length){ rem.textContent = ''; return; }
  rem.textContent = '振り分け後の未確定: ' + f.locs.map(id=>{
    const used = [...el('vfRows').querySelectorAll(`[data-wh="${id}"]`)].reduce((n,x)=>n+(Number(x.value)||0),0);
    return `${whName(id)} ${fmtNum(f.stock[id]-used)}`;
  }).join('、');
}
async function submitVariants(v){
  clearFieldErrors();
  const f = variantForm, rows = [], seen = new Set(), used = {};
  const taken = f.existing.map(p=>variantLabel(p).toLowerCase());
  for(const row of el('vfRows').querySelectorAll('.vf-row')){
    const i = row.dataset.i, label = (v['vl_'+i]||'').trim();
    const isExisting = !!row.querySelector('input[type=hidden][data-vlabel]');
    const alloc = {};
    for(const id of f.locs){
      const raw = v[`va_${i}_${id}`]||''; if(raw==='') continue;
      const n = nonNegInt(raw);
      if(n===null){ setFieldError(`va_${i}_${id}`,'0以上の整数で入力してください。'); return; }
      if(n>0){ alloc[id]=n; used[id]=(used[id]||0)+n; }
    }
    if(isExisting){ if(Object.keys(alloc).length) rows.push({label,alloc}); seen.add(label.toLowerCase()); continue; }
    if(!label){ if(Object.keys(alloc).length){ setFieldError('vl_'+i,'名前を入力してください。'); return; } continue; }
    if(label===UNDECIDED){ setFieldError('vl_'+i,`「${UNDECIDED}」は名前に使えません。`); return; }
    if(seen.has(label.toLowerCase())){ setFieldError('vl_'+i,'同じ名前があります。'); return; }
    if(taken.includes(label.toLowerCase())){ setFieldError('vl_'+i,'すでに登録されています。'); return; }
    seen.add(label.toLowerCase());
    const cost = v['vc_'+i], price = v['vp_'+i];
    if(!(cost!=='' && Number(cost)>=0)){ setFieldError('vc_'+i,''); setFieldError('vl_'+i,'原価は0以上で入力してください。'); return; }
    if(!(price!=='' && Number(price)>=0)){ setFieldError('vp_'+i,''); setFieldError('vl_'+i,'税込価格は0以上で入力してください。'); return; }
    rows.push({label,cost:Number(cost),price:Number(price),alloc});
  }
  if(!rows.length){ setFormError(f.locs.length?'名前か振り分ける数を入力してください。':'名前を入力してください。'); return; }
  for(const id of f.locs){ if((used[id]||0)>f.stock[id]){ setFormError(`${whName(id)}の振り分け合計が在庫(${fmtNum(f.stock[id])})を超えています。`); return; } }
  const { data, error } = await sb.rpc('fn_web_set_variants',{ p_product_id:f.base.id, p_variant_key:v.vkey, p_rows:rows, p_date:today() });
  if(error){ setFormError(errText(error)); return; }
  expandedIds.add('m'+data);
  closeDrawer(); await refresh();
  showToast('登録しました。商品マスタにも追加してください');
}
function openVariantEdit(p){
  const stocked = totalQty(p.id)>0;
  const body = `<div class="field full"><span class="label">商品</span><div class="plain-value">${esc(p.product_name)}</div></div>`
    + field({name:'label',label:'サイズ・容量の名前',required:true,value:variantLabel(p)})
    + field({name:'cost',label:'原価(円)',type:'number',half:true,value:Number(p.standard_cost)})
    + field({name:'price',label:'税込価格(円)',type:'number',half:true,value:Number(p.selling_price)})
    + field({name:'state',label:'状態',half:true,value:'on',options:stocked?[{value:'on',label:'使用中'}]:[{value:'on',label:'使用中'},{value:'off',label:'停止する'}],
        after:`<p class="hint">${stocked?'在庫が0になると停止できます。':'停止すると一覧から消えます。同じ名前で登録し直すと戻せます。'}</p>`})
    + `<div class="field full"><p class="hint">商品コード ${esc(p.product_code)} は変わりません。商品マスタも同じ内容に直してください。</p></div>`
    + formErrorSlot;
  drawerOp = null;
  openDrawer('サイズ・容量を編集', body, async v=>{
    clearFieldErrors();
    if(!v.label){ setFieldError('label','名前を入力してください。'); return; }
    if(!(v.cost!=='' && Number(v.cost)>=0)){ setFieldError('cost','0以上で入力してください。'); return; }
    if(!(v.price!=='' && Number(v.price)>=0)){ setFieldError('price','0以上で入力してください。'); return; }
    const { error } = await sb.rpc('fn_web_update_variant',{ p_product_id:p.id, p_label:v.label, p_cost:Number(v.cost), p_price:Number(v.price), p_active:v.state!=='off' });
    if(error){ setFormError(errText(error)); return; }
    closeDrawer(); await refresh(); showToast('保存しました');
  }, '保存');
}
function nextCode(list, column, prefix, width){
  const nums = list.map(r=>String(r[column]||'')).filter(c=>c.startsWith(prefix)).map(c=>parseInt(c.slice(prefix.length),10)).filter(n=>!isNaN(n));
  return prefix + String((nums.length?Math.max(...nums):0)+1).padStart(width,'0');
}
function openSupplierForm(s){
  openDrawer(s?'仕入れ先を編集':'仕入れ先を追加',
    field({name:'name',label:'会社名・屋号',required:true,value:s&&s.supplier_name,placeholder:'例: 〇〇縫製工場'})
    + field({name:'contact',label:'担当者名',half:true,value:s&&s.contact_person})
    + field({name:'phone',label:'電話番号',half:true,type:'tel',value:s&&s.phone})
    + field({name:'email',label:'メールアドレス',type:'email',value:s&&s.email})
    + field({name:'address',label:'住所',value:s&&s.address})
    + formErrorSlot,
    async v=>{
      clearFieldErrors();
      if(!v.name){ setFieldError('name','会社名・屋号を入力してください。'); return; }
      const row = { supplier_name:v.name, contact_person:v.contact||null, phone:v.phone||null, email:v.email||null, address:v.address||null };
      const q = s ? sb.from('suppliers').update(row).eq('id',s.id)
                  : sb.from('suppliers').insert({...row, supplier_code:nextCode(db.suppliers,'supplier_code','S',3)});
      const { error } = await q;
      if(error){ setFormError(errText(error)); return; }
      closeDrawer(); await refresh(); showToast('仕入れ先を保存しました');
    });
}
function openPartnerForm(w){
  const c = w ? (db.customers.find(x=>x.id===w.customer_id)||{}) : {};
  openDrawer(w?'委託先を編集':'委託先を追加',
    field({name:'name',label:'店舗名・会社名',required:true,value:w&&w.warehouse_name,placeholder:'例: 〇〇スポーツショップ'})
    + field({name:'phone',label:'電話番号',half:true,type:'tel',value:c.phone})
    + field({name:'email',label:'メールアドレス',half:true,type:'email',value:c.email})
    + field({name:'address',label:'住所',value:c.address})
    + field({name:'notes',label:'メモ',value:c.notes,placeholder:'担当者、手数料率、精算サイクルなど'})
    + formErrorSlot,
    async v=>{
      clearFieldErrors();
      if(!v.name){ setFieldError('name','店舗名・会社名を入力してください。'); return; }
      const cust = { name:v.name, phone:v.phone||null, email:v.email||null, address:v.address||null, notes:v.notes||null };
      if(w){
        const a = await sb.from('customers').update(cust).eq('id',w.customer_id);
        if(a.error){ setFormError(errText(a.error)); return; }
        const b = await sb.from('warehouses').update({warehouse_name:v.name}).eq('id',w.id);
        if(b.error){ setFormError(errText(b.error)); return; }
      } else {
        const a = await sb.from('customers').insert({...cust, customer_type:'company'}).select().single();
        if(a.error){ setFormError(errText(a.error)); return; }
        const b = await sb.from('warehouses').insert({ warehouse_code:nextCode(db.warehouses,'warehouse_code','C',2), warehouse_name:v.name, warehouse_type:'consignment', customer_id:a.data.id });
        if(b.error){ setFormError(errText(b.error)); return; }
      }
      closeDrawer(); await refresh(); showToast('委託先を保存しました');
    });
}

/* ---------- actions ---------- */
const num = t => Number(t.dataset.id);
const actions = {
  nav(t){ setSection(t.dataset.section); },
  closeDrawer(){ closeDrawer(); },
  async signOut(){ await sb.auth.signOut(); me=null; showLogin(); },
  opNew(){ openOpChooser(); },
  op(t){ openOp(t.dataset.op, t.dataset.id); },
  setVariants(t){ openVariantForm(t.dataset.id); },
  editVariant(t){ const p = db.products.find(x=>x.id===num(t)); if(p) openVariantEdit(p); },
  vPreset(t){ addVariantRow({label:t.dataset.label}); syncVariantForm(); },
  vAddRow(){ const r = addVariantRow({}); syncVariantForm(); if(r) r.querySelector('input').focus(); },
  vRemoveRow(t){ t.closest('.vf-row').remove(); syncVariantForm(); },
  addSupplier(){ openSupplierForm(null); },
  addPartner(){ openPartnerForm(null); },
  editSupplier(t){ const s = db.suppliers.find(x=>x.id===num(t)); if(s) openSupplierForm(s); },
  editPartner(t){ const w = db.warehouses.find(x=>x.id===num(t)); if(w) openPartnerForm(w); },
  editThreshold(t){ const p = db.products.find(x=>x.id===num(t)); if(p) openThreshold(p); },
  async offSupplier(t){
    const s = db.suppliers.find(x=>x.id===num(t)); if(!s) return;
    if(!(await confirmDialog('仕入れ先を無効にしますか?',`「${s.supplier_name}」を一覧から外します。過去の履歴は残ります。`,'無効にする'))) return;
    const { error } = await sb.from('suppliers').update({active:false}).eq('id',s.id);
    if(error){ showToast(errText(error)); return; }
    await refresh(); showToast('仕入れ先を無効にしました');
  },
  async offPartner(t){
    const w = db.warehouses.find(x=>x.id===num(t)); if(!w) return;
    const n = db.inventories.filter(i=>i.warehouse_id===w.id).reduce((s,i)=>s+i.quantity,0);
    if(n>0){ showToast(`預け在庫が${n}点あります。先に移管してください。`); return; }
    if(!(await confirmDialog('委託先を無効にしますか?',`「${w.warehouse_name}」を一覧から外します。過去の履歴は残ります。`,'無効にする'))) return;
    const { error } = await sb.from('warehouses').update({active:false}).eq('id',w.id);
    if(error){ showToast(errText(error)); return; }
    await refresh(); showToast('委託先を無効にしました');
  },
  toggleLow(){ invState.low = !invState.low; renderInventory(); },
  setLoc(t){ invState.loc = t.dataset.loc; renderInventory(); },
  viewLoc(t){ clearInv(); invState.loc = t.dataset.id; setSection('inventory'); renderInventory(); },
  clearInv(){ clearInv(); renderInventory(); },
  chartLoc(t){ invState.loc = String(invState.loc)===t.dataset.id ? 'all' : t.dataset.id; renderAll(); },
  chartItem(t){
    const id = t.dataset.id;
    clearInv(); expandedIds.add(id); renderAll();
    const row = document.querySelector(`tr[data-id="${id}"]`);
    if(row){ row.scrollIntoView({block:'center'}); const b=row.querySelector('[data-act="toggle"]'); if(b) b.focus(); }
  },
  sort(t){
    const k = t.dataset.key;
    if(invState.sort===k){ if(invState.dir===1) invState.dir=-1; else { invState.sort=null; invState.dir=1; } }
    else { invState.sort=k; invState.dir = k==='name' ? 1 : -1; }
    renderList();
  },
  sortMargin(){
    if(productState.sort!=='margin'){ productState.sort='margin'; productState.dir=-1; }
    else if(productState.dir<0){ productState.dir=1; }
    else { productState.sort=null; productState.dir=-1; }
    renderProducts();
  },
  toggle(t){ const id=t.dataset.id; if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id); renderAll(); },
  chooseOp(t){ openOp(t.dataset.op, null); }
};
function clearInv(){ invState.cat='全て'; invState.low=false; invState.loc='all'; invState.search=''; el('searchBox').value=''; }
function openOpChooser(){
  el('drawerTitle').textContent = '入出庫を登録';
  el('drawerBody').innerHTML = `<div class="field full op-choices">
    <button type="button" class="btn" data-act="chooseOp" data-op="inbound">${icon('in')}入庫</button>
    <button type="button" class="btn" data-act="chooseOp" data-op="outbound">${icon('out')}出庫</button>
    <button type="button" class="btn" data-act="chooseOp" data-op="transfer">${icon('swap')}移管</button>
    <button type="button" class="btn" data-act="chooseOp" data-op="adjust">${icon('sliders')}棚卸・調整</button>
  </div>`;
  drawerSubmit = null;
  el('drawerSubmit').hidden = true;
  if(!el('drawer').open) el('drawer').showModal();
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(t){ actions[t.dataset.act](t,e); return; }
  if(e.target.closest('a,button,input,select,label,.detail')) return;
  const row = e.target.closest('[data-row-act]');
  if(row) actions[row.dataset.rowAct](row,e);
});
document.addEventListener('input', e=>{
  if(e.target.closest && e.target.closest('.vf-row')) syncVariantForm();
  if(e.target.getAttribute && e.target.getAttribute('aria-invalid')){
    e.target.removeAttribute('aria-invalid');
    const err = el('drawerBody').querySelector(`[data-err="${e.target.name}"]`);
    if(err) err.textContent = '';
  }
});
document.addEventListener('change', e=>{
  if(e.target.name==='product' && drawerOp && drawerOp.pickable && e.target.value){ openOp(drawerOp.kind, e.target.value, true); return; }
  if(e.target.name==='vkey') syncVariantForm();
  if(e.target.name==='wh'||e.target.name==='product') updateAdjustHint();
});
el('drawerForm').addEventListener('submit', e=>e.preventDefault());
el('drawerBody').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.isComposing && e.target.tagName==='INPUT'){ e.preventDefault(); runDrawerSubmit(); }
});
el('drawerSubmit').addEventListener('click', ()=>runDrawerSubmit());
/* Keep the input focused during the tap: on a phone the keyboard closing moves the button out from under the finger */
el('drawerSubmit').addEventListener('mousedown', e=>e.preventDefault());
async function runDrawerSubmit(){
  if(!drawerSubmit || drawerBusy) return;
  drawerBusy = true;
  const b = el('drawerSubmit'), label = b.textContent;
  b.disabled = true; b.textContent = '処理中…';
  try{ await drawerSubmit(formValues()); }
  catch(err){ setFormError(errText(err)); }
  finally{ drawerBusy = false; b.disabled = false; b.textContent = label; }
}
el('drawer').addEventListener('click', e=>{ if(e.target===el('drawer')) closeDrawer(); });
el('drawer').addEventListener('close', ()=>{ el('drawerSubmit').hidden = false; });
el('confirmDlg').addEventListener('click', e=>{ if(e.target===el('confirmDlg')) el('confirmDlg').close(); });
el('searchBox').addEventListener('input', e=>{ invState.search=e.target.value; renderList(); });
el('catSelect').addEventListener('change', e=>{ invState.cat=e.target.value; renderList(); });
el('historySearch').addEventListener('input', e=>{ historyState.search=e.target.value; renderHistory(); });
el('historyType').addEventListener('change', e=>{ historyState.type=e.target.value; renderHistory(); });
el('productSearch').addEventListener('input', e=>{ productState.search=e.target.value; renderProducts(); });
el('productCat').addEventListener('change', e=>{ productState.cat=e.target.value; renderProducts(); });
el('supplierSearch').addEventListener('input', e=>{ supplierState.search=e.target.value; renderSuppliers(); });
el('partnerSearch').addEventListener('input', e=>{ partnerState.search=e.target.value; renderPartners(); });
el('sheetLink').href = SHEET_URL;
/* pick up changes made on another device when returning to the page */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && me && !el('drawer').open) refresh().catch(()=>{});
});

/* ---------- login ---------- */
function showOnly(id){ ['loginView','messageView','appView'].forEach(v=>{ el(v).hidden = v!==id; }); }
function showLogin(){ showOnly('loginView'); el('loginPass').value=''; el('loginEmail').focus(); }
function showMessage(title, text, withLogout){
  showOnly('messageView');
  el('messageTitle').textContent = title;
  el('messageText').textContent = text;
  el('messageBtn').hidden = !withLogout;
}
async function enter(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  const { data, error } = await sb.from('members').select('display_name,role,active').eq('user_id',user.id);
  if(error) throw error;
  const row = (data||[]).find(m=>m.active);
  if(!row){ showMessage('利用できません','このアカウントはメンバーに登録されていません。管理者に確認してください。',true); return; }
  me = row;
  el('meName').textContent = me.display_name;
  await loadAll();
  showOnly('appView');
  setSection((location.hash||'').slice(1));
  renderAll();
}
el('loginForm').addEventListener('submit', e=>e.preventDefault());
el('loginBtn').addEventListener('click', ()=>doLogin());
['loginEmail','loginPass'].forEach(id=>el(id).addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); doLogin(); }
}));
let loginBusy = false;
async function doLogin(){
  if(loginBusy) return;
  const err = el('loginErr'), btn = el('loginBtn');
  err.textContent='';
  const email = el('loginEmail').value.trim(), password = el('loginPass').value;
  if(!email || !password){ err.textContent='メールアドレスとパスワードを入力してください。'; return; }
  if(!sb){ err.textContent='読み込みが完了していません。ページを再読み込みしてください。'; return; }
  loginBusy = true; btn.disabled = true; btn.textContent = 'ログイン中…';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ err.textContent = /invalid/i.test(error.message) ? 'メールアドレスまたはパスワードが違います。' : errText(error); return; }
    await enter();
  }catch(ex){ err.textContent = errText(ex); }
  finally{ loginBusy = false; btn.disabled = false; btn.textContent = 'ログイン'; }
}
(async function init(){
  if(!window.supabase){ showMessage('読み込めませんでした','通信状態を確認して、ページを再読み込みしてください。',false); return; }
  const timedFetch = (url, init) => Promise.race([
    fetch(url, init),
    new Promise((_, reject)=>setTimeout(()=>reject(new TypeError('Failed to fetch')), 20000))
  ]);
  sb = window.supabase.createClient(SB_URL, SB_KEY, {
    global: { fetch: timedFetch },
    auth: { lock: async (_name, _timeout, fn) => fn() }
  });
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) await enter(); else showLogin();
  }catch(ex){ showMessage('読み込めませんでした',errText(ex),true); }
})();
</script>
